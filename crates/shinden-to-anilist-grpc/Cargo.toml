[package]
name = "shinden-to-anilist-grpc"
version = "1.0.2"
edition = "2024"
license = "MPL-2.0"

[features]
default = ["grpc"]
grpc = [
    "dep:prost-types",
    "tokio-stream/net",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-web",
    "dep:tower-http",
]

[[bin]]
name = "shinden-to-anilist-grpc"
required-features = ["grpc"]

[dependencies]
arc-swap = "1.9"
prost = "0.14"
prost-types = { version = "0.14", optional = true }
rayon = "1.12"
reqwest = { version = "0.13", features = ["brotli", "cookies", "deflate", "gzip", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shinden-to-anilist-core = { path = "../shinden-to-anilist-core" }
tap = "1.0.1"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = { version = "0.14", features = ["transport"], optional = true }
tonic-prost = { version = "0.14", optional = true }
tonic-web = { version = "0.14", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-prost-build = "0.14"
