name: Production Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux artifacts
    runs-on: ubuntu-24.04
    # Keep the Ubuntu 22.04 glibc baseline for shipped Linux binaries.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Install Linux packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            ffmpeg \
            file \
            gh \
            git \
            libasound2 \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgbm1 \
            libgtk-3-dev \
            libnss3 \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            protobuf-compiler \
            wget \
            xdg-utils \
            zstd

          protoc --version
          ffmpeg -version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check release version
        run: pnpm version:check

      - name: Install appimagetool
        env:
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl --fail --silent --show-error --location --retry 3 --output "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$tool" | sha256sum --check
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux Electron AppImages
        run: pnpm export:linux

      - name: Verify packaged Electron addons
        run: |
          node frontend/tests/native-addon.test.mjs \
            dist/system-electron/*.AppDir/usr/lib/shindentoanilist/resources/native/shinden_to_anilist.node
          ELECTRON_RUN_AS_NODE=1 dist/electron-builder/linux-unpacked/shindentoanilist \
            frontend/tests/native-addon.test.mjs \
            dist/electron-builder/linux-unpacked/resources/native/shinden_to_anilist.node

      - name: Build Linux Tauri executable
        run: pnpm bundle:tauri:linux

      - name: Verify Tauri Linux executable links WebKitGTK
        run: |
          ldd dist/tauri-linux/*-linux-x64-tauri
          ldd dist/tauri-linux/*-linux-x64-tauri | grep 'libwebkit2gtk-4.1.so'

      - name: Build Linux Tauri AppImage
        run: pnpm bundle:tauri:appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shindentoanilist-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/electron-builder/*.AppImage
            dist/tauri-linux/*-linux-x64-tauri
            dist/tauri-appimage/*.AppImage

      - name: Attach Linux assets to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No GitHub Release exists for $RELEASE_TAG yet; keeping workflow artifacts only."
            exit 0
          fi

          gh release upload "$RELEASE_TAG" \
            dist/*.AppImage \
            dist/electron-builder/*.AppImage \
            dist/tauri-linux/*-linux-x64-tauri \
            dist/tauri-appimage/*.AppImage \
            --clobber

  windows-native:
    name: Windows Tauri executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check release version
        run: pnpm version:check

      - name: Install Windows build tools
        shell: pwsh
        run: |
          choco install protoc ffmpeg --no-progress -y

          protoc --version
          ffmpeg -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Windows executable
        run: pnpm bundle:tauri:windows

      - name: Upload Tauri Windows native executable
        uses: actions/upload-artifact@v7
        with:
          name: shindentoanilist-windows-tauri
          if-no-files-found: error
          path: dist/tauri-windows/*.exe

      - name: Attach Windows asset to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No GitHub Release exists for $RELEASE_TAG yet; keeping workflow artifacts only."
            exit 0
          fi

          gh release upload "$RELEASE_TAG" dist/tauri-windows/*.exe --clobber
