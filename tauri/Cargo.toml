[package]
name = "shinden-to-anilist-tauri"
version = "1.0.2"
edition = "2024"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "shinden_to_anilist_tauri"

[dependencies]
reqwest = { version = "0.13", features = ["brotli", "cookies", "deflate", "gzip", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shinden-to-anilist-grpc = { path = "../crates/shinden-to-anilist-grpc" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wayland-nvidia-quirk = "0.1.0"
tokio-util = "0.7"
tracing = "0.1"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
